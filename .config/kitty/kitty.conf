# Install Lastest Version
# curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin

# BEGIN_KITTY_THEME
# Gruvbox Dark Soft
include current-theme.conf
# END_KITTY_THEME

# Vs Code Light
#include vscode-light.conf
# Vs Code Light END

cursor_blink_interval 0

# Cursor Config for Light Theme
#cursor  #000000
#cursor_shape block
#cursor_text_color #ffffff

# Font Config
#font_family      Source Code Pro
#font_family      Ubuntu Sans Mono
#font_family      Droid Sans Mono Dotted for Powerline
#font_family      Dejavu Sans Mono
#font_family      Fira Code Retina
font_family      Fira Code
font_size        12
#text_composition_strategy 1.0 0
text_composition_strategy legacy

# Window Config
#hide_window_decorations yes
placement_strategy top-left

enabled_layouts splits,stack
# split right (or use --location=after)
#map ctrl+g>v launch --location=vsplit
# split left
map ctrl+g>v launch --location=before
# split down
#map ctrl+g>s launch --location=hsplit
# split up
map ctrl+g>s combine : launch --location=hsplit : move_window up

map ctrl+g>h neighboring_window left
map ctrl+g>j neighboring_window down
map ctrl+g>k neighboring_window up
map ctrl+g>l neighboring_window right
map ctrl+g>q close_window

map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
map shift+up        scroll_line_up
map shift+down      scroll_line_down
map shift+home      scroll_home
map shift+end       scroll_end

map alt+left  resize_window narrower
map alt+right resize_window wider
map alt+up    resize_window taller
map alt+down  resize_window shorter

window_border_width 1
window_drag_tolerance 10
active_border_color #cc6666
inactive_border_color #555555

tab_bar_edge bottom
tab_title_max_lines 2
tab_title_template "{index}: {title}"

#tab_bar_style separator
#tab_separator " "

tab_bar_style powerline
#tab_powerline_style slanted
#tab_powerline_style round
tab_powerline_style angled

map ctrl+down next_tab
map ctrl+up  previous_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
