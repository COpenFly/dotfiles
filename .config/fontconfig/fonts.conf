<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 以 Fira Code 为西文首选时，缺失的中文字形回退到更纱黑体 SC -->
  <match target="pattern">
    <test name="family"><string>Fira Code</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Sarasa Mono SC Regular</string>
    </edit>
  </match>

  <!-- 通用 monospace 亦按「西文 Fira Code + 中文更纱」的顺序解析 -->
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Fira Code</family>
      <family>Sarasa Mono SC Regular</family>
    </prefer>
  </alias>
</fontconfig>
